<script>
// ============================================================
// НАСТРОЙКИ
// ============================================================
const COLS = 100;
const ROWS = 100;
const CELL_SIZE = 6;
const CANVAS_SIZE = COLS * CELL_SIZE;
const ZOOM_MIN = 1;
const ZOOM_MAX = 4;
const AD_COOLDOWN_SECONDS = 10;
const AD_REWARD = 10;
const STORAGE_KEY = 'pixel_battle_data';
const BALANCE_KEY = 'pixel_battle_balance';

// ============================================================
// ЭЛЕМЕНТЫ
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_SIZE;
canvas.height = CANVAS_SIZE;

const statusEl = document.getElementById('status');
const cooldownTimerEl = document.getElementById('cooldown-timer');
const zoomInfo = document.getElementById('zoom-info');
const coordsEl = document.getElementById('coords');
const totalPixelsEl = document.getElementById('totalPixels');
const balanceEl = document.getElementById('click-balance');
const balanceBigEl = document.getElementById('click-balance-big');
const placeBtn = document.getElementById('place-btn');
const adBtn = document.getElementById('ad-btn');

const adModal = document.getElementById('ad-modal');
const adTimerEl = document.getElementById('ad-timer');
const adCloseBtn = document.getElementById('ad-close-btn');

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let pixels = [];
let balance = 0;
let panX = 0, panY = 0;
let zoom = 1;
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let panStartX = 0, panStartY = 0;

let selectedColor = '#ff0000';

let isAdOnCooldown = false;
let adCooldownInterval = null;

let isAdOpen = false;
let adCountdown = 10;
let adInterval = null;

// ============================================================
// ЗАГРУЗКА
// ============================================================
function loadData() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      pixels = JSON.parse(data);
      pixels = pixels.filter(p => p.x < COLS && p.y < ROWS && p.x >= 0 && p.y >= 0);
    } else {
      pixels = [];
    }
  } catch (e) { pixels = []; }
  
  try {
    const bal = localStorage.getItem(BALANCE_KEY);
    if (bal) { balance = parseInt(bal) || 0; }
  } catch (e) { balance = 0; }
  
  updateStats();
  draw();
  updateAdCooldownDisplay();
}

function savePixels() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(pixels)); } catch (e) {}
  updateStats();
}

function saveBalance() {
  try { localStorage.setItem(BALANCE_KEY, String(balance)); } catch (e) {}
  updateStats();
}

// ============================================================
// ПАЛИТРА
// ============================================================
const paletteColors = [
  '#000000','#434343','#666666','#999999','#b7b7b7','#cccccc','#d9d9d9','#efefef','#f3f3f3','#ffffff',
  '#980000','#ff0000','#ff9900','#ffff00','#00ff00','#00ffff','#4a86e8','#0000ff','#9900ff','#ff00ff',
  '#e6b8af','#f4cccc','#fce5cd','#fff2cc','#d9ead3','#d0e0e3','#c9daf8','#cfe2f3','#d9d2e9','#ead1dc',
  '#dd7e6b','#ea9999','#f9cb9c','#ffe599','#b6d7a8','#a2c4c9','#a4c2f4','#9fc5e8','#b4a7d6','#d5a6bd',
  '#cc4125','#e06666','#f6b26b','#ffd966','#93c47d','#76a5af','#6d9eeb','#6fa8dc','#8e7cc3','#c27ba0',
  '#a61c00','#cc0000','#e69138','#f1c232','#6aa84f','#45818e','#3c78d8','#3d85c6','#674ea7','#a64d79',
  '#85200c','#990000','#b45f06','#bf9000','#38761d','#134f5c','#1155cc','#0b5394','#351c75','#741b47'
];

function buildPalette() {
  const container = document.getElementById('color-palette');
  container.innerHTML = '';
  paletteColors.forEach(color => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch';
    swatch.style.background = color;
    swatch.dataset.color = color;
    if (color === selectedColor) swatch.classList.add('active');
    swatch.addEventListener('click', () => selectColor(color));
    container.appendChild(swatch);
  });
}

function selectColor(color) {
  selectedColor = color;
  document.querySelectorAll('.color-swatch').forEach(el => {
    el.classList.toggle('active', el.dataset.color === color);
  });
  document.getElementById('custom-color-input').value = color;
  document.getElementById('hex-input').value = color;
  document.getElementById('color-preview').style.background = color;
}

// ============================================================
// ОТРИСОВКА
// ============================================================
function draw() {
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  const center = CANVAS_SIZE / 2;
  ctx.translate(center + panX, center + panY);
  ctx.scale(zoom, zoom);
  ctx.translate(-center, -center);

  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    const pos = i * CELL_SIZE;
    ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, CANVAS_SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(CANVAS_SIZE, pos); ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(COLS / 2 * CELL_SIZE, 0); ctx.lineTo(COLS / 2 * CELL_SIZE, CANVAS_SIZE); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, ROWS / 2 * CELL_SIZE); ctx.lineTo(CANVAS_SIZE, ROWS / 2 * CELL_SIZE); ctx.stroke();
  ctx.setLineDash([]);

  for (let p of pixels) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x * CELL_SIZE, p.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
  ctx.restore();

  zoomInfo.textContent = `🔍 ${zoom.toFixed(1)}x`;
}

function updateStats() {
  totalPixelsEl.textContent = pixels.length;
  balanceEl.textContent = balance;
  balanceBigEl.textContent = balance;
}

// ============================================================
// КУЛДАУН НА РЕКЛАМУ
// ============================================================
function startAdCooldown() {
  if (isAdOnCooldown) return;
  
  isAdOnCooldown = true;
  adBtn.disabled = true;
  let seconds = AD_COOLDOWN_SECONDS;
  
  cooldownTimerEl.textContent = `⏳ Реклама через ${seconds}с`;
  statusEl.textContent = `⏳ Подождите ${seconds}с для новой рекламы`;
  
  adCooldownInterval = setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      clearInterval(adCooldownInterval);
      adCooldownInterval = null;
      isAdOnCooldown = false;
      adBtn.disabled = false;
      cooldownTimerEl.textContent = '✅ Можно смотреть рекламу';
      statusEl.textContent = '✅ Нажмите "Реклама" для +10 кликов';
    } else {
      cooldownTimerEl.textContent = `⏳ Реклама через ${seconds}с`;
      statusEl.textContent = `⏳ Подождите ${seconds}с для новой рекламы`;
    }
  }, 1000);
}

function updateAdCooldownDisplay() {
  if (!isAdOnCooldown) {
    cooldownTimerEl.textContent = '✅ Можно смотреть рекламу';
  }
}

// ============================================================
// КООРДИНАТЫ КЛИКА
// ============================================================
function getWorldCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const relX = (clientX - rect.left) / rect.width;
  const relY = (clientY - rect.top) / rect.height;
  const canvasX = relX * CANVAS_SIZE;
  const canvasY = relY * CANVAS_SIZE;
  const center = CANVAS_SIZE / 2;
  const worldX = (canvasX - center - panX) / zoom + center;
  const worldY = (canvasY - center - panY) / zoom + center;
  const col = Math.floor(worldX / CELL_SIZE);
  const row = Math.floor(worldY / CELL_SIZE);
  return { x: Math.max(0, Math.min(COLS - 1, col)), y: Math.max(0, Math.min(ROWS - 1, row)) };
}

// ============================================================
// ПОСТАВИТЬ ПИКСЕЛЬ
// ============================================================
function placePixel(col, row) {
  if (balance <= 0) {
    statusEl.textContent = '❌ Нет кликов! Смотрите рекламу.';
    return false;
  }
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) {
    statusEl.textContent = '❌ За пределами';
    return false;
  }

  const color = selectedColor;
  pixels = pixels.filter(p => !(p.x === col && p.y === row));
  pixels.push({ x: col, y: row, color });
  balance--;
  savePixels();
  saveBalance();
  draw();
  statusEl.textContent = `✅ Пиксель (${col}, ${row}) поставлен! Осталось: ${balance}`;
  updateStats();
  return true;
}

// ============================================================
// КНОПКА "ПОСТАВИТЬ"
// ============================================================
placeBtn.addEventListener('click', () => {
  const center = CANVAS_SIZE / 2;
  const col = Math.floor(((center - panX) / zoom + panX - center) / CELL_SIZE);
  const row = Math.floor(((center - panY) / zoom + panY - center) / CELL_SIZE);
  placePixel(Math.max(0, Math.min(COLS - 1, col)), Math.max(0, Math.min(ROWS - 1, row)));
});

// ============================================================
// РЕКЛАМА (10 кликов)
// ============================================================
adBtn.addEventListener('click', () => {
  if (isAdOpen) return;
  if (isAdOnCooldown) {
    statusEl.textContent = '⏳ Подождите окончания кулдауна!';
    return;
  }
  openAdModal();
});

function openAdModal() {
  isAdOpen = true;
  adBtn.disabled = true;
  adModal.classList.add('active');
  
  adCountdown = 10;
  adTimerEl.textContent = adCountdown;
  adCloseBtn.disabled = true;
  adCloseBtn.className = '';
  adCloseBtn.textContent = `⏳ Подождите ${adCountdown}с...`;
  
  adInterval = setInterval(() => {
    adCountdown--;
    adTimerEl.textContent = adCountdown;
    adCloseBtn.textContent = `⏳ Подождите ${adCountdown}с...`;
    
    if (adCountdown <= 0) {
      clearInterval(adInterval);
      adInterval = null;
      adCloseBtn.disabled = false;
      adCloseBtn.className = 'active';
      adCloseBtn.textContent = '✅ Получить 10 кликов!';
    }
  }, 1000);
}

function closeAdModal(giveReward) {
  if (adInterval) { clearInterval(adInterval); adInterval = null; }
  
  adModal.classList.remove('active');
  isAdOpen = false;
  adBtn.disabled = false;
  
  if (giveReward) {
    balance += AD_REWARD;
    saveBalance();
    updateStats();
    statusEl.textContent = `✅ +10 кликов! Баланс: ${balance}`;
    startAdCooldown();
  } else {
    statusEl.textContent = '❌ Реклама не засчитана';
  }
}

adCloseBtn.addEventListener('click', () => {
  if (adCloseBtn.disabled) return;
  if (adCountdown <= 0) closeAdModal(true);
});

adModal.addEventListener('click', (e) => {
  if (e.target === adModal && adCountdown <= 0) closeAdModal(true);
});

// ============================================================
// УПРАВЛЕНИЕ КАМЕРОЙ
// ============================================================
function clampPan() {
  if (zoom <= 1) { panX = 0; panY = 0; return; }
  const maxPan = (CANVAS_SIZE * (zoom - 1)) / 2;
  panX = Math.max(-maxPan, Math.min(maxPan, panX));
  panY = Math.max(-maxPan, Math.min(maxPan, panY));
}

canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  panStartX = panX;
  panStartY = panY;
  canvas.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const rect = canvas.getBoundingClientRect();
  panX = panStartX + (e.clientX - dragStartX) / rect.width * CANVAS_SIZE;
  panY = panStartY + (e.clientY - dragStartY) / rect.height * CANVAS_SIZE;
  clampPan();
  draw();
});

window.addEventListener('mouseup', () => {
  if (isDragging) { isDragging = false; canvas.style.cursor = 'grab'; }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  let newZoom = zoom * delta;
  if (newZoom < ZOOM_MIN) newZoom = ZOOM_MIN;
  if (newZoom > ZOOM_MAX) newZoom = ZOOM_MAX;
  zoom = newZoom;
  clampPan();
  draw();
}, { passive: false });

canvas.addEventListener('click', (e) => {
  if (isDragging) return;
  const { x, y } = getWorldCoords(e.clientX, e.clientY);
  coordsEl.textContent = `x: ${x}, y: ${y}`;
  placePixel(x, y);
});

// ============================================================
// ТЕЛЕФОН
// ============================================================
let touchStartX = 0, touchStartY = 0, touchPanStartX = 0, touchPanStartY = 0;
let touchDist = 0, touchZoom = 1, isTouchDragging = false;

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    isTouchDragging = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchPanStartX = panX;
    touchPanStartY = panY;
  } else if (e.touches.length === 2) {
    touchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    touchZoom = zoom;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  if (e.touches.length === 1 && isTouchDragging) {
    panX = touchPanStartX + (e.touches[0].clientX - touchStartX) / rect.width * CANVAS_SIZE;
    panY = touchPanStartY + (e.touches[0].clientY - touchStartY) / rect.height * CANVAS_SIZE;
    clampPan();
    draw();
  } else if (e.touches.length === 2) {
    const newDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const delta = newDist / touchDist;
    let newZoom = touchZoom * delta;
    if (newZoom < ZOOM_MIN) newZoom = ZOOM_MIN;
    if (newZoom > ZOOM_MAX) newZoom = ZOOM_MAX;
    zoom = newZoom;
    clampPan();
    draw();
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) {
    isTouchDragging = false;
    if (touchStartX && e.changedTouches.length > 0) {
      const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
      const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
      if (dx < 10 && dy < 10) {
        const { x, y } = getWorldCoords(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        coordsEl.textContent = `x: ${x}, y: ${y}`;
        placePixel(x, y);
      }
    }
  }
}, { passive: false });

const customColorInput = document.getElementById('custom-color-input');
const hexInput = document.getElementById('hex-input');
const colorPreview = document.getElementById('color-preview');

customColorInput.addEventListener('input', (e) => {
  const color = e.target.value;
  hexInput.value = color;
  colorPreview.style.background = color;
  selectColor(color);
});

hexInput.addEventListener('input', (e) => {
  let value = e.target.value.trim();
  if (value && !value.startsWith('#')) value = '#' + value;
  if (/^#[0-9a-f]{6}$/i.test(value)) {
    selectColor(value);
    customColorInput.value = value;
    colorPreview.style.background = value;
  }
});

hexInput.addEventListener('blur', () => {
  if (!/^#[0-9a-f]{6}$/i.test(hexInput.value.trim())) {
    hexInput.value = selectedColor;
  }
});
